apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazonapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aws
  template:
    metadata:
      labels:
        app: aws
    spec:
      containers:
        - name: amazonapp-container
          image: rapakakarthik7/dockerrepo:amazonapp 
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: amazonapp-service
spec:
  type: NodePort  
  selector:
    app: aws 
  ports:
    - port: 80  
      targetPort: 80  
      nodePort: 30008  