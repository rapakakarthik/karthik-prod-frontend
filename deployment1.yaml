# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shell
  template:
    metadata:
      labels:
        app: shell
    spec:
      containers:
        - name: amazon-container
          image: rapakakarthik7/dockerrepo:114 
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: amazon-service
spec:
  type: NodePort  
  selector:
    app: shell 
  ports:
    - port: 80  
      targetPort: 80  
      nodePort: 30001  