apiVersion: v1
kind: Pod
metadata:
  name: apache
  labels:
    app: httpd
spec:
  containers:
    - name: apache-container
      image: httpd:latest  
      ports:
        - containerPort: 80  
      volumeMounts:
        - name: apache-volume
          mountPath: /usr/local/apache2/htdocs/  
  volumes:
    - name: apache-volume
      emptyDir: {}  